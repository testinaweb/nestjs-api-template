name: CD

# Builds and pushes the Docker image to ECR on every push to main. Does not run
# tests — CI (ci.yml) already gates every PR before it can reach main.
on:
  push:
    branches: [main, develop]

permissions:
  id-token: write # required for OIDC auth to AWS, no long-lived AWS keys needed
  contents: read

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve environment config
        run: |
          echo "AWS_REGION=eu-west-1" >> "$GITHUB_ENV"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENVIRONMENT=production" >> "$GITHUB_ENV"
            echo "AWS_ROLE_ARN=arn:aws:iam::210987654321:role/GithubActionsBackendRole" >> "$GITHUB_ENV"
            echo "DOCKER_REGISTRY=210987654321.dkr.ecr.eu-west-1.amazonaws.com/backend" >> "$GITHUB_ENV"
            echo "CLUSTER_NAME=ProductionCluster" >> "$GITHUB_ENV"
            echo "SERVICE_NAME=PLACEHOLDER" >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT=staging" >> "$GITHUB_ENV"
            echo "AWS_ROLE_ARN=arn:aws:iam::123456789012:role/GithubActionsBackendRole" >> "$GITHUB_ENV"
            echo "DOCKER_REGISTRY=123456789012.dkr.ecr.eu-west-1.amazonaws.com/backend" >> "$GITHUB_ENV"
            echo "CLUSTER_NAME=StagingCluster" >> "$GITHUB_ENV"
            echo "SERVICE_NAME=PLACEHOLDER" >> "$GITHUB_ENV"
          fi


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Upload Docker image to ECR
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          IMAGE_TAG="${REPO_NAME}-${ENVIRONMENT}-$(date +"%Y%m%d%H%M")"
          IMAGE_TAG_LATEST="${REPO_NAME}-${ENVIRONMENT}-latest"
          docker build \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t $DOCKER_REGISTRY:$IMAGE_TAG \
            -t $DOCKER_REGISTRY:$IMAGE_TAG_LATEST .

          docker push "$DOCKER_REGISTRY:$IMAGE_TAG"
          docker push "$DOCKER_REGISTRY:$IMAGE_TAG_LATEST"

      # - name: Deploy to AWS ECS
      #   run: |
      #     aws ecs update-service --cluster $CLUSTER_NAME \
      #     --service $SERVICE_NAME \
      #     --force-new-deployment --region $AWS_REGION
