name: CD

# Builds and pushes the Docker image to ECR on every push to main. Does not run
# tests — CI (ci.yml) already gates every PR before it can reach main.
on:
  push:
    branches: [main, develop]

permissions:
  id-token: write # required for OIDC auth to AWS, no long-lived AWS keys needed
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          GIT_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        run: |
          IMAGE_TAG="${ENVIRONMENT}-$(date +"%Y%m%d%H%M")"
          docker build \
            --build-arg GIT_SHA="$GIT_SHA" \
            --build-arg ENVIRONMENT="$ENVIRONMENT" \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
